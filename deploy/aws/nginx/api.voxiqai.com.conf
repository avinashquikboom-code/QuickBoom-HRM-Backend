# ============================================================================
# HRM API — nginx site (HTTP). Installed by backend.sh to
# /etc/nginx/sites-available/ and enabled as a symlink in sites-enabled/.
# certbot (setup-domain.sh) adds the HTTPS server block.
# The file name, server_name and API_DOMAIN in config.sh must all match.
# $connection_upgrade comes from /etc/nginx/conf.d/00-global.conf.
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.voxiqai.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # WebSocket (socket.io): long-lived connections
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
