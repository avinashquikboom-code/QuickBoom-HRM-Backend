# ============================================================================
# HRM Admin panel — nginx site (HTTP). Installed by admin.sh to
# /etc/nginx/sites-available/ and enabled as a symlink in sites-enabled/.
# certbot (setup-domain.sh) adds the HTTPS server block.
# The file name must equal ADMIN_DOMAIN in config.sh; no www alias (not used).
# $connection_upgrade comes from /etc/nginx/conf.d/00-global.conf.
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name voxiqai.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
